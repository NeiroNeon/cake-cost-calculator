<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EFE8">
<meta name="description" content="Сводный расчёт стоимости выбранных калькуляторов.">
<title>Сводный расчёт — Pastry Studio</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f4efe8;--paper:#fff;--ink:#211b15;--muted:#82776b;--line:#e8e0d6;--accent:#b4562e;--soft:#faede4;--bad:#a52f24;--good:#26724c}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#f7f3ed,#f0e9df);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,calc((100vw - 900px)/2));padding-top:calc(12px + env(safe-area-inset-top));background:#f4efe8ed;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.brand{font-weight:700;letter-spacing:-.02em}
.top a{color:var(--accent);text-decoration:none;font-size:14px}
.wrap{width:min(900px,100%);margin:auto;padding:28px 18px calc(36px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:clamp(23px,5vw,30px);letter-spacing:-.04em;line-height:1.15;margin:0}
.muted{color:var(--muted)}
.count{font-size:13px;color:var(--muted);white-space:nowrap}
.add-panel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;padding:14px;background:#ffffffb8;border:1px solid #ffffffd9;border-radius:18px;box-shadow:0 12px 34px -28px #57351f;margin-bottom:14px}
.field{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;border:1px solid var(--line);border-radius:11px;padding:0 14px;background:#fff;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{min-height:20px;margin:0 2px 10px;font-size:13px;color:var(--muted)}
.status.error{color:var(--bad)}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px 16px;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px -26px #57351f}
.item-main{min-width:0}
.item-title{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.item-meta{font-size:12px;color:var(--muted);margin-top:3px}
.item-warning{font-size:12px;color:#96601e;margin-top:4px}
.item-side{display:flex;align-items:center;gap:12px}
.item-cost{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.qty{display:flex;align-items:center;gap:5px;padding:4px;border:1px solid var(--line);border-radius:12px;background:#fcfaf7}
.qty button{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:18px;line-height:1}
.qty input{width:36px;border:0;outline:0;background:transparent;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}
.remove{border:0;background:transparent;color:#a69a8d;font-size:21px;width:28px;height:32px}
.remove:hover{color:var(--bad)}
.empty{padding:34px 20px;text-align:center;border:1px dashed #d9cfc2;border-radius:16px;color:var(--muted);background:#ffffff66}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}
.total{position:sticky;bottom:12px;margin-top:16px;padding:17px 18px;border:1px solid #e8d8c9;border-radius:18px;background:#fffaf5ed;backdrop-filter:blur(12px);box-shadow:0 16px 36px -24px #57351f}
.total-top{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.total-value{font-size:clamp(25px,6vw,34px);font-weight:750;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:3px}
.total-note{font-size:12px;color:var(--muted);margin-top:3px}
.total-note.warning{color:#96601e}
.footer-actions{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
@media(max-width:600px){
 .top{padding-left:16px;padding-right:16px}
 .wrap{padding:22px 14px calc(28px + env(safe-area-inset-bottom))}
 .add-panel{grid-template-columns:1fr}
 .item{grid-template-columns:minmax(0,1fr);gap:10px;padding:14px}
 .item-side{justify-content:space-between}
 .item-cost{text-align:left;margin-right:auto}
 .total{bottom:8px}
}
@media(prefers-reduced-motion:no-preference){.item{animation:appear .2s ease both}@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Pastry Studio</div>
  <a href="./index.html">← К калькуляторам</a>
</header>
<main class="wrap">
  <div class="head">
    <div>
      <h1>Сводный расчёт</h1>
      <div class="muted">Общая стоимость выбранных калькуляторов</div>
    </div>
    <span class="count" id="selectedCount">0 позиций</span>
  </div>

  <section class="add-panel" aria-label="Добавить калькулятор">
    <select class="field" id="calculatorSelect" aria-label="Выберите калькулятор">
      <option value="">Выберите калькулятор…</option>
    </select>
    <button class="btn primary" id="addCalculator" type="button" disabled>＋ Добавить</button>
  </section>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <section class="list" id="summaryList" aria-label="Выбранные калькуляторы"></section>

  <section class="total" aria-live="polite" aria-atomic="true">
    <div class="total-top"><span>Общая стоимость</span><span id="totalCount">0 калькуляторов</span></div>
    <div class="total-value" id="grandTotal">0,00 BYN</div>
    <div class="total-note" id="totalNote">Добавьте калькуляторы, чтобы собрать общий итог.</div>
  </section>

  <div class="footer-actions">
    <button class="btn" id="clearList" type="button" disabled>Очистить список</button>
    <a class="btn" href="./index.html">Готово</a>
  </div>
</main>
<script type="module" src="./src/summary.js"></script>
<script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) { window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(() => {})); }</script>
</body>
</html>
